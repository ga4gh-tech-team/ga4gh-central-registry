openapi: 3.1.1

info:
  title: GA4GH Schema Registry API
  version: 0.1.0
  description: > 
    The Schema Registry API enables browsing and querying versioned GA4GH JSON schemas.
    It provides a standard for representing and sharing schemas, and
    can be implemented by independent providers, which can then interoperate to share schemas across domains.

paths:
  /schemas:
    get:
      operationId: listSchemas
      summary: Return all schemas with the queried properties.
      parameters:
        - $ref: '#/components/parameters/SchemaFilter'
        - $ref: '#/components/parameters/WorkstreamFilter'
        - $ref: '#/components/parameters/MaintainersFilter'
        - $ref: '#/components/parameters/MaturityLevelFilter'
      responses:
        '200':
          $ref: '#/components/responses/SchemasResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /namespaces:
    get:
      operationId: listNamespaces
      summary: Return all namespaces in the registry.
      responses:
        '200':
          $ref: '#/components/responses/NamespacesResponse'
  /schemas/{namespace}:
    get:
      operationId: listNamespaceSchemas
      summary: > 
        Return all schemas for the given namespace.
        Can be filtered using query parameters.
      description: >
        Returns a list of schemas under this namespace. The list can
        be filtered using query parameters matching properties of the Schema object.
      parameters:
        - $ref: '#/components/parameters/NamespacePath'
        - $ref: '#/components/parameters/SchemaFilter'
        - $ref: '#/components/parameters/WorkstreamFilter'
        - $ref: '#/components/parameters/MaintainersFilter'
        - $ref: '#/components/parameters/MaturityLevelFilter'
      responses:
        '200':
          $ref: '#/components/responses/SchemasResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /schemas/{namespace}/{schema_name}:
    get:
      operationId: listSchemaVersions
      summary: > 
        Return all versions for the queried schema.
      description: Return all versions for the specified schema.
      parameters:
        - $ref: '#/components/parameters/NamespacePath'
        - $ref: '#/components/parameters/SchemaNamePath'
      responses:
        '200':
          $ref: '#/components/responses/SchemaVersionsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /schemas/{namespace}/{schema_name}/{version}:
    get:
      operationId: getJSONSchema
      summary: Returns the JSON Schema document itself
      parameters:
      - $ref: '#/components/parameters/NamespacePath'
      - $ref: '#/components/parameters/SchemaNamePath'
      - $ref: '#/components/parameters/VersionPath'
      responses:
        '200':
          $ref: '#/components/responses/JSONSchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    NamespacePath:
      name: namespace
      in: path
      required: true
      description: The namespace containing the schema.
      schema:
        type: string
    SchemaNamePath:
      name: schema_name
      in: path
      required: true
      description: The name of the schema.
      schema:
        type: string
    VersionPath:
      name: version
      in: path
      required: true
      schema:
        type: string
      description: >
        The semantic version.
        The special value `latest` is equivalent to specifying the same string
        as in the target schema's `latest_version` property.
    SchemaFilter:
      name: schema
      in: query
      description: Query a specific schema by name.
      schema:
        type: string
    WorkstreamFilter:
      name: workstream
      in: query
      description: Query schemas that are part of the specified workstream.
      schema:
        type: string
    MaintainersFilter:
      name: maintainers
      in: query
      description: Query schemas from specific maintainers.
      schema:
        type: string
    MaturityLevelFilter:
      name: maturity_level
      in: query
      description: Query schemas with specific maturity level.
      schema:
        type: string
        enum: [draft, trial_use, normative, deprecated]

  schemas:
    Namespace:
      type: object
      description: > 
        Lists all namespaces contained in the registry.
        A namespace usually refers to the organization that developed the schema.
      properties:
        name:
          type: string
          description: Identifier for the namespace.
          example: GA4GH
        server_url:
          type: string
          format: uri
          description: URL for the server hosting the schemas for a namespace.
          example: https://example1.com/schemas
        contact_url:
          type: string
          format: uri
          description: URL to find more information about the namespace.
          example: https://www.ga4gh.org/
      required: [name, server_url]
      example:
        name: GA4GH
        server_url: https://example1.com/schemas
        contact_url: https://www.ga4gh.org/
    SchemaRecord:
      type: object
      description: List all queried schemas.
      properties:
        name:
          type: string
          description: Name of the schema.
          example: phenopackets
        namespace:
          type: string
          description: Name of the namespace containing the schema.
          example: GA4GH
        latest_version:
          type: string
          description: >
            Latest version of this schema that currently exists in this repository.
          example: 2.0.0
        maintainers:
          type: array
          description: Name of maintainer(s) of the schema.
          items:
            type: string
          example: [Jane Doe, John Smith]
        workstream:
          type: string
          description: Workstream that manages the schema.
          example: Clinical/Phenotypic Data Capture
        maturity_level:
          type: string
          enum: [draft, trial_use, normative, deprecated]
          description: > 
            The maturity level of the schema, as defined by the
            [GA4GH GKS Maturity Model specification]
            (https://vrs.ga4gh.org/en/2.0.0-ballot.2024-11/appendices/maturity_model.html).
          example: normative
      required: [name, namespace, latest_version]
      example:
        name: phenopackets
        namespace: GA4GH
        latest_version: 2.0.0
        maintainers: [Jane Doe, John Smith]
        workstream: Clinical/Phenotypic Data Capture
        maturity_level: normative
    SchemaVersions:
      type: object
      description: List all versions of the queried schema.
      properties:
        name:
          type: string
          description: Name of the schema.
          example: phenopackets
        version:
          type: string
          pattern: '\d\.\d.\d|latest'
          description: > 
            Immutable identifier for this schema version.
            Follows the [GA4GH GKS Maturity Model specification](https://vrs.ga4gh.org/en/2.0.0-ballot.2024-11/appendices/maturity_model.html).
          example: 2.0.0
        status:
          type: string
          enum: [current, deprecated, latest]
          example: latest
        release_date:
          type: string
          format: date
          example: '2021-06-01'
        contributors:
          type: array
          items:
            type: string
          example: [Jane Doe, John Smith]
        release_notes:
          type: string
          example: Major revision of the Phenopacket schema.
        tags:
          type: object
          additionalProperties:
            type: string
          description: >
            User-definable key/value pairs that provide additional
            information about this schema version.
          example:
            json_schema_draft: '2020-12'
      required: [name, version]
      example:
        name: phenopackets
        version: 2.0.0
        status: latest
        release_date: '2021-06-01'
        contributors: [Jane Doe, John Smith]
        release_notes: Major revision of the Phenopacket schema.
    Error:
      type: object
      description: An object that can optionally include information about the error.
      properties:
        message:
          type: string
          description: A detailed error message.
          example: Namespace 'GA4GH' not found.
        status_code:
          type: integer
          description: The HTTP status code.
          example: 404
      required: [message, status_code]

  responses:
    NamespacesResponse:
      description: Lists all namespaces hosted by the server.
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/Namespace'
            required: [results]
          example:
            results:
            - name: GA4GH
              server_url: https://example1.com/schemas
              contact_url: https://www.ga4gh.org/
            - name: CanDIG
              server_url: https://example2.com/schemas
              contact_url: https://candig.ca/contact/
    SchemasResponse:
      description: Lists all schemas linked to a namespace
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaRecord'
            required: [results]
          example:
            results:
            - name: phenopackets
              namespace: GA4GH
              latest_version: 2.0.0
              maintainers: [Jane Doe, John Smith]
              workstream: Clinical/Phenotypic Data Capture
              maturity_level: normative
            - name: vrs
              namespace: GA4GH
              latest_version: 2.0.0
              maintainers: [Jane Doe]
              workstream: Genomic Knowledge Standards
              maturity_level: normative
    SchemaVersionsResponse:
      description: List all versions of the specified schema.
      content:
        application/json:
          schema:
            type: object
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaVersions'
            required: [results]
          example:
            results:
            - name: phenopackets
              version: 2.0.0
              status: latest
              release_date: '2021-06-01'
              contributors: [Jane Doe, John Smith]
              release_notes: Major revision of the Phenopacket schema.
            - name: phenopackets
              version: 1.0.0
              status: deprecated
              release_date: '2019-10-01'
              contributors: [Jane Doe]
              release_notes: Initial release of the Phenopacket schema.
    JSONSchemaResponse:
      description: The JSON Schema for the requested version.
      content:
        application/json:
          schema:
            type: object
          example:
            {
              "$id": "https://example1.com/schemas/genomics-analysis/versions/2.0.1",
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "title": "Genomics Analysis Schema",
              "type": "object",
              "properties": {
                "sample_id": {
                  "type": "string",
                  "description": "Unique identifier for the biological sample."
                },
                "sequencing_platform": {
                  "type": "string",
                  "description": "Platform used for sequencing, e.g., Illumina NovaSeq."
                }
              }
            }
    BadRequest:
      description: >
        The request is malformed, a query parameter has an invalid value
        or the version is neither a semantic version nor `latest`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested namespace, schema or version was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'